server:
  port: 8080

spring:
  application:
    name: phoenix-forensic-gateway

  codec:
    max-in-memory-size: 1GB

  webflux:
    multipart:
      max-in-memory-size: 1GB
      max-disk-usage-per-part: 1GB

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST

      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      httpclient:
        connect-timeout: 10000
        response-timeout: 300s

      routes:
        - id: fastapi_analysis_route
          uri: http://ai-backend:8000
          predicates:
            - Path=/verify-video/**,/verify-hash/**,/cases/**,/docs,/openapi.json

        - id: fastapi_chat_route
          uri: http://ai-backend:8000
          predicates:
            - Path=/forensic-assistant/**

        - id: fastapi_feedback_route
          uri: http://ai-backend:8000
          predicates:
            - Path=/feedback/**,/download-report/**

        - id: dashboard_route
          uri: http://ai-backend:8000
          predicates:
            - Path=/dashboard/**

        - id: model_metrics_route
          uri: http://ai-backend:8000
          predicates:
            - Path=/model-metrics

        - id: system_route
          uri: http://ai-backend:8000
          predicates:
            - Path=/system/**

        - id: vector_route
          uri: http://ai-backend:8000
          predicates:
            - Path=/similarity/**,/vector-search/**

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
